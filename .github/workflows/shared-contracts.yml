name: Shared contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet run --project tests/SharedContracts -c Release
  installer-cache:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/InstallerCache.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/InstallerLoaderReuse.ps1
